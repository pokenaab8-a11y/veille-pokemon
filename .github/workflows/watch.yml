name: Veille cartes Pokemon

on:
  schedule:
    - cron: "*/20 * * * *"    # toutes les 20 minutes
  workflow_dispatch:           # bouton "Run workflow" pour lancer a la main

permissions:
  contents: write              # necessaire pour sauvegarder seen.json

# Evite deux executions simultanees qui se marcheraient dessus
concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Lancer la veille
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POKEMONTCG_API_KEY: ${{ secrets.POKEMONTCG_API_KEY }}
        run: python bot.py

      - name: Sauvegarder l'etat (seen.json)
        run: |
          git config user.name "pokemon-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json price_cache.json
          git commit -m "maj etat de veille" || echo "rien a committer"
          git push || echo "push impossible (ignore)"
